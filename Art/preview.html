<!doctype html>
<html><head><meta charset="utf-8">
<!-- Renders Mod/About/Preview.png: the source illustration (Preview.png in this folder, no text) with the
     name, a summary line and the version badge laid over it, composed at the final 896 x 504 so no glyph is
     resampled. Colours: preview-palette.json. Rasteriser: headless Chrome:
     chrome.exe --headless=new --disable-gpu --hide-scrollbars --force-device-scale-factor=1 --window-size=896,504
       --virtual-time-budget=4000 --screenshot=../Mod/About/Preview.png file:///<this folder>/preview.html -->
<style>
  :root { --veil:#2B323B; --ink:#F2ECE1; --ink2:#A9BCD0; --accent:#7CCB2F; --badge:#17120E; }
  html,body { margin:0; padding:0; }
  body { width:896px; height:504px; overflow:hidden; position:relative; background:#000;
         font-family:"Segoe UI", system-ui, sans-serif; }
  .art { position:absolute; inset:0; width:896px; height:504px; background:url("Preview.png") center/cover no-repeat; }
  .veil { position:absolute; inset:0;
          background:linear-gradient(90deg, rgba(43,50,59,.78) 0%, rgba(43,50,59,.66) 34%, rgba(43,50,59,.25) 52%, rgba(43,50,59,0) 62%); }
  .block { position:absolute; left:50px; top:54px; }
  h1 { margin:0; font-size:46px; font-weight:600; line-height:1.1; letter-spacing:0; color:var(--ink);
       text-shadow:0 3px 10px rgba(0,0,0,.75); }
  h1 .pre { font-size:.65em; color:var(--ink2); }
  .rule { width:58px; height:3px; background:var(--accent); margin:20px 0 16px 0; }
  p { margin:0; width:430px; font-size:21px; font-weight:400; line-height:1.45; letter-spacing:0; text-wrap:balance; color:var(--ink);
      text-shadow:0 3px 10px rgba(0,0,0,.75); }
  .tri { position:absolute; right:0; top:0; width:896px; height:504px; }
  .ver { position:absolute; left:869px; top:27px; width:0; height:0; }
  .ver span { position:absolute; left:-30px; top:-13px; width:60px; text-align:center; font-size:26px; font-weight:700;
              line-height:1; color:var(--badge); transform:rotate(45deg); }
</style></head>
<body>
  <div class="art"></div>
  <div class="veil"></div>
  <div class="block">
    <h1><span class="pre">Nelim's</span><br>Pickle Tools</h1>
    <div class="rule"></div>
    <p>Shared Pickle steps for testing RimWorld mods</p>
  </div>
  <svg class="tri" viewBox="0 0 896 504" width="896" height="504"><polygon points="816,0 896,0 896,80" fill="#7CCB2F"/></svg>
  <div class="ver"><span>1.6</span></div>
</body></html>
